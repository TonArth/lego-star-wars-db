        function createTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            Object.keys(data).forEach((setName, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-button' + (index === 0 ? ' active' : '');
                btn.textContent = setName.split(':')[1].trim();
                btn.onclick = () => selectTab(setName);
                tabsContainer.appendChild(btn);
            });
        }

        function selectTab(setName) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${setName}`).classList.add('active');
        }

        function createContent() {
            const contentArea = document.getElementById('contentArea');
            Object.entries(data).forEach(([setName, characters], index) => {
                const tabDiv = document.createElement('div');
                tabDiv.id = `tab-${setName}`;
                tabDiv.className = 'tab-content' + (index === 0 ? ' active' : '');

                let html = `<h2 class="set-title">${setName}</h2>`;
                html += '<div class="table-container"><table>';
                html += '<tr><th>Personaj</th><th>Cod</th><th>Preț</th><th>BrickLink</th><th>Notă</th></tr>';

                characters.forEach(char => {
                    const brickLinkUrl = char.code
                        ? `https://www.bricklink.com/v2/catalog/catalogitem.page?M=${char.code}`
                        : `https://www.bricklink.com/v2/search.page?q=${char.query}+minifigure`;
                    const codeCell = char.code ? char.code : 'N/A';
                    html += `<tr>
                        <td class="character-name">${char.name}</td>
                        <td class="code">${codeCell}</td>
                        <td class="price">${char.price}</td>
                        <td><a href="${brickLinkUrl}" target="_blank" class="bricklink-btn">🔗 BrickLink</a></td>
                        <td class="note">${char.note}</td>
                    </tr>`;
                });

                html += '</table></div>';
                tabDiv.innerHTML = html;
                contentArea.appendChild(tabDiv);
            });
        }

        createTabs();
        createContent();
